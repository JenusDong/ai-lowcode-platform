<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderList 组件测试</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@4.24.15/dist/antd.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            margin-bottom: 20px;
        }
        .error-message {
            padding: 20px;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 4px;
            color: #ff4d4f;
            margin-bottom: 20px;
        }
        .error-message pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>OrderList 组件测试</h1>

        <div id="order-list-container"></div>
    </div>

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/moment@2.24.0/min/moment.min.js"></script>
    <script src="https://unpkg.com/antd@4.24.15/dist/antd.min.js"></script>
    <script src="/mall-components.umd.js"></script>

    <script>
        window.addEventListener('load', function() {
            console.log('MallComponents:', window.MallComponents);
            console.log('OrderList:', window.MallComponents ? window.MallComponents.OrderList : 'undefined');

            if (!window.MallComponents || !window.MallComponents.OrderList) {
                console.error('OrderList 组件未找到！');
                document.getElementById('order-list-container').innerHTML = `
                    <div class="error-message">
                        <h3>组件加载失败</h3>
                        <p>OrderList 组件未找到！请检查 UMD 文件是否正确加载。</p>
                        <pre>window.MallComponents: ${JSON.stringify(window.MallComponents, null, 2)}</pre>
                    </div>
                `;
                return;
            }

            try {
                const OrderList = window.MallComponents.OrderList;

                const testProps = {
                    showFilter: true,
                    showStatusFilter: true,
                    showSearch: true,
                    showDatePicker: true,
                    showActions: true,
                    showBatchOperations: true,
                    showExport: true,
                    defaultPageSize: 10,
                    onRowClick: function(record) {
                        console.log('Row clicked:', record);
                    },
                    onSearch: function(params) {
                        console.log('Search params:', params);
                    },
                    onPageChange: function(page, pageSize) {
                        console.log('Page changed:', page, pageSize);
                    },
                    onActionClick: function(action, record) {
                        console.log('Action:', action, record);
                    },
                    onBatchOperation: function(operation, orderIds) {
                        console.log('Batch operation:', operation, orderIds);
                    }
                };

                console.log('Creating OrderList with props:', testProps);

                const element = React.createElement(OrderList, testProps);

                console.log('React element created:', element);

                ReactDOM.render(
                    element,
                    document.getElementById('order-list-container')
                );

                console.log('OrderList rendered successfully');
            } catch (error) {
                console.error('OrderList 渲染失败:', error);
                document.getElementById('order-list-container').innerHTML = `
                    <div class="error-message">
                        <h3>渲染失败</h3>
                        <p>错误信息: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
